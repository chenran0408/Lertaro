name: Code quality

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json
      - name: Restore documentation tool
        run: dotnet tool restore
      - name: Install site dependencies
        run: npm ci
        working-directory: Site
      - name: Build API reference and all site locales
        run: npm run docs:build
        working-directory: Site

  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check source file size
        shell: pwsh
        run: ./Tools/TestSourceSize.ps1
      - name: Test source size gate
        run: dotnet test Tests/Tools/SourceSize/SourceSize.csproj -c Release -v quiet
      - name: Build strict projects
        run: dotnet build Tools/CompactionBenchmark/CompactionBenchmark.csproj -c Release -p:EnableRustIndexStoreBuild=false -v quiet
      - name: Verify dotnet format style (core projects)
        shell: pwsh
        # Ratchet: the shipped core projects are format-clean since the repo-wide sweep; plugins
        # join this list as they get their own pass. A new warning fails the job instead of
        # silently accumulating again.
        run: |
          $projects = @('App/App.csproj', 'Core/Core.csproj', 'PluginSdk/PluginSdk.csproj',
                        'Service/Service.csproj', 'Cli/Cli.csproj', 'TaskbarHost/TaskbarHost.csproj')
          $failed = @()
          foreach ($project in $projects) {
            $output = dotnet format style $project --verify-no-changes 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { $failed += "$project`n$output" }
          }
          if ($failed.Count -gt 0) {
            Write-Error "dotnet format style found issues:`n$($failed -join "`n`n")"
            exit 1
          }
