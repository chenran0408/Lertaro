name: ARM plugin diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  plugins:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a4890cac893bf0c5e354ec4d84cb40834232dd8
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run affected plugin suites
        shell: pwsh
        run: |
          $failed = @()
          foreach ($name in 'BrowserData','ContentSearch','FlowLauncherBridge') {
            dotnet test "Tests/Plugins/$name/$name.csproj" -c Release -r win-arm64 -p:RustIndexStoreTarget=aarch64-pc-windows-msvc --logger 'console;verbosity=normal' --logger "trx;LogFileName=$name.trx" --results-directory results -v quiet
            if ($LASTEXITCODE) { $failed += $name }
          }
          for ($round = 2; $round -le 6; $round++) {
            dotnet test Tests/Plugins/FlowLauncherBridge/FlowLauncherBridge.csproj -c Release -r win-arm64 --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=Flow-$round.trx" --results-directory results
            if ($LASTEXITCODE) { $failed += "Flow-$round" }
          }
          if ($failed.Count) { throw "Failed suites $failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-results
          path: results/*.trx

