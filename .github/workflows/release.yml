name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # 1. Checkout codebase with full history to retrieve previous tags/commits
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The Core project builds its in-process index store for the current RID.
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-pc-windows-msvc

      # 2. Configure .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 3. Install Inno Setup 7, required for the 64-bit x64 Setup shell
      - name: Install Inno Setup
        run: |
          winget install JRSoftware.InnoSetup.7 --force --silent --no-upgrade --accept-source-agreements

      # 4. Execute the build and package batch script
      - name: Run Build and Package Script
        run: |
          .\make.bat

      # 5. Publish short, user-facing notes instead of a raw commit log.
      - name: Generate Changelog
        id: changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="release-notes/${RELEASE_TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp -- "$NOTES_FILE" changelog.md
          else
            printf '%s\n' '改进日常使用体验。' '' '普通电脑下载 Lertaro-Setup.exe；免安装版选择 Lertaro-Portable.zip。ARM 电脑请选择带 arm64 的文件。' > changelog.md
          fi
          echo "" >> changelog.md

      # Both application and service pin this same public key; never publish placeholder signatures.
      - name: Sign and Verify Release Packages
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          ./Tools/SignRelease.ps1 -PackageDirectory dist
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Signing failed.' }
          Add-Content changelog.md "`n<details><summary>文件校验信息（可选）</summary>`n"
          Add-Content changelog.md '更新包已使用本 fork 的更新密钥签名，并完成校验。'
          Add-Content changelog.md "`nSHA-256：`n"
          foreach ($name in @('Lertaro-Setup.exe','Lertaro-Portable.zip','Lertaro-Setup-arm64.exe','Lertaro-Portable-arm64.zip')) {
            $hash = (Get-FileHash (Join-Path dist $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content changelog.md ('- **' + $name + '**: `' + $hash + '`')
          }
          Add-Content changelog.md "`n</details>"
      # 6. Publish release and upload artifacts (installer, portable ZIP, and signature)
      # The new repository is not visible to legacy installs, so ARM64 assets use the conventional
      # hyphenated suffix. Keep these names in sync with make.bat and UpdateAssetSelector.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: changelog.md
          files: |
            dist/Lertaro-Setup.exe
            dist/Lertaro-Portable.zip
            dist/Lertaro-Portable.zip.sig
            dist/Lertaro-Setup-arm64.exe
            dist/Lertaro-Portable-arm64.zip
            dist/Lertaro-Portable-arm64.zip.sig
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
