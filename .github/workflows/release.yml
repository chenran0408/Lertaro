name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
      - name: Require a new matching version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content App/App.csproj)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag does not match the application version.' }
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check existing releases.' }
          if ($tags -ccontains $env:RELEASE_TAG) { throw 'Published releases are immutable. Use a new version.' }

  validate:
    needs: preflight
    uses: ./.github/workflows/beta-validation.yml
    secrets: inherit

  publish:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Download the exact signed packages exercised by both architecture smoke-test jobs.
      - uses: actions/download-artifact@v4
        with:
          name: beta-candidate
          path: dist

      # 5. Publish short, user-facing notes instead of a raw commit log.
      - name: Generate Changelog
        id: changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="release-notes/${RELEASE_TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp -- "$NOTES_FILE" changelog.md
          else
            printf '%s\n' '改进日常使用体验。' '' '普通电脑下载 Lertaro-Setup.exe；免安装版选择 Lertaro-Portable.zip。ARM 电脑请选择带 arm64 的文件。' > changelog.md
          fi
          echo "" >> changelog.md

      - name: Verify tested packages and record hashes
        shell: pwsh
        run: |
          $verifier = [Security.Cryptography.ECDsa]::Create()
          try {
            $verifier.ImportFromPem([IO.File]::ReadAllText('release-signing-public-key.pem'))
            foreach ($name in @('Lertaro-Portable.zip','Lertaro-Portable-arm64.zip')) {
              $path = Join-Path dist $name
              if (!$verifier.VerifyData([IO.File]::ReadAllBytes($path), [IO.File]::ReadAllBytes($path + '.sig'),
                  [Security.Cryptography.HashAlgorithmName]::SHA256,
                  [Security.Cryptography.DSASignatureFormat]::Rfc3279DerSequence)) {
                throw "Invalid update signature: $name"
              }
            }
          } finally { $verifier.Dispose() }
          Add-Content changelog.md "`n<details><summary>文件校验信息（可选）</summary>`n"
          Add-Content changelog.md '更新包已使用本 fork 的更新密钥签名，并完成校验。'
          Add-Content changelog.md "`nSHA-256：`n"
          Add-Content changelog.md ('Source commit: `' + $env:GITHUB_SHA + '`')
          foreach ($name in @('Lertaro-Setup.exe','Lertaro-Portable.zip','Lertaro-Setup-arm64.exe','Lertaro-Portable-arm64.zip')) {
            $hash = (Get-FileHash (Join-Path dist $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content changelog.md ('- **' + $name + '**: `' + $hash + '`')
          }
          Add-Content changelog.md "`n</details>"
      # 6. Publish release and upload artifacts (installer, portable ZIP, and signature)
      # The new repository is not visible to legacy installs, so ARM64 assets use the conventional
      # hyphenated suffix. Keep these names in sync with make.bat and UpdateAssetSelector.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: changelog.md
          files: |
            dist/Lertaro-Setup.exe
            dist/Lertaro-Portable.zip
            dist/Lertaro-Portable.zip.sig
            dist/Lertaro-Setup-arm64.exe
            dist/Lertaro-Portable-arm64.zip
            dist/Lertaro-Portable-arm64.zip.sig
          name: ${{ github.ref_name }}
          draft: false
          fail_on_unmatched_files: true
          overwrite_files: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
