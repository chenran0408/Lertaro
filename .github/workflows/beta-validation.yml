name: Beta validation

on:
  workflow_call:
    secrets:
      SIGNING_KEY:
        required: true
  workflow_dispatch:
  push:
    branches:
      - main
      - beta

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  windows-tests:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            rust_target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            rid: win-arm64
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public repository links
        shell: pwsh
        run: |
          $stale = @(Get-ChildItem README.md, Readmes -File -Recurse |
            Select-String -Pattern 'github\.com/Lertaro/Lertaro')
          if ($stale.Count -gt 0) {
            Write-Error "Found stale links to the old Lertaro/Lertaro repository:`n$stale"
            exit 1
          }
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.rust_target }}
      - name: Test native index store
        shell: pwsh
        run: cargo test --locked --target ${{ matrix.rust_target }} --manifest-path Core/NativeIndexStore/Cargo.toml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test app
        run: dotnet test Tests/App/App.csproj -c Release -r ${{ matrix.rid }} -p:RustIndexStoreTarget=${{ matrix.rust_target }} --logger "console;verbosity=normal" -v quiet
      - name: Test update core
        if: success() || failure()
        run: dotnet test Tests/Core/Core.csproj -c Release -r ${{ matrix.rid }} -p:RustIndexStoreTarget=${{ matrix.rust_target }} --logger "console;verbosity=normal" -v quiet
      - name: Test bundled actions
        if: success() || failure()
        run: dotnet test Tests/Plugins/CoreExtensions/CoreExtensions.csproj -c Release -r ${{ matrix.rid }} -p:RustIndexStoreTarget=${{ matrix.rust_target }} --logger "console;verbosity=normal" -v quiet
      - name: Test clipboard history
        if: success() || failure()
        run: dotnet test Tests/Plugins/ClipboardHistory/ClipboardHistory.csproj -c Release -r ${{ matrix.rid }} --logger "console;verbosity=normal" -v quiet
      - name: Test remaining plugins (observe first, enforce once green)
        if: success() || failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $featured = @('CoreExtensions', 'ClipboardHistory')
          Get-ChildItem "Tests/Plugins/*/*.csproj" |
            Where-Object { $featured -notcontains $_.Directory.Name } |
            ForEach-Object {
              Write-Host "::group::$($_.Directory.Name)"
              dotnet test $_.FullName -c Release -r "${{ matrix.rid }}" -p:RustIndexStoreTarget="${{ matrix.rust_target }}" --logger "console;verbosity=quiet"
              Write-Host "::endgroup::"
            }

  package:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-pc-windows-msvc
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The Inno Setup installer comes from GitHub Releases, and that endpoint has had sustained
      # outage windows -- winget lost four consecutive 504s across four minutes on one run. Fetch
      # it into the cache ourselves (same retry shape as the taskbar assets) so one healthy
      # download serves every later run, then install it silently where make.bat looks for it.
      - name: Cache package compiler
        uses: actions/cache@v4
        with:
          path: obj/CompilerCache
          key: innosetup-7.1.1-x64
      - name: Install package compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path obj/CompilerCache | Out-Null
          $exe = 'obj/CompilerCache/innosetup-7.1.1-x64.exe'
          if (!(Test-Path $exe)) {
            $attempt = 0
            while ($true) {
              try {
                Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $exe -UseBasicParsing
                break
              } catch {
                $attempt++
                if ($attempt -ge 6) { throw }
                Start-Sleep -Seconds (15 * $attempt)
              }
            }
          }
          $process = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES','/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installer exited with $($process.ExitCode)." }
          if (!(Test-Path 'C:\Program Files\Inno Setup 7\ISCC.exe')) { throw 'Inno Setup 7 is not where make.bat expects it.' }
      # The taskbar bundle assets (~50MB across nine pinned GitHub downloads) cost a release run
      # each when the Releases endpoint has a bad day; keyed on assets.json so a bump re-fetches.
      - name: Cache taskbar bundle assets
        uses: actions/cache@v4
        with:
          path: obj/TaskbarDownloadCache
          key: taskbar-assets-${{ hashFiles('ThirdParty/TranslucentTB/assets.json') }}
      - name: Build both installers
        run: .\make.bat
      - name: Verify packaged index store architectures
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($check in @(
            @{ Path = 'dist/Lertaro-Portable.zip'; Machine = 0x8664; Name = 'x64' },
            @{ Path = 'dist/Lertaro-Portable-arm64.zip'; Machine = 0xAA64; Name = 'ARM64' }
          )) {
            $archive = [IO.Compression.ZipFile]::OpenRead($check.Path)
            try {
              $entry = $archive.Entries | Where-Object { $_.Name -eq 'lertaro_index_store.dll' } | Select-Object -First 1
              if (-not $entry) { throw "$($check.Name) ZIP is missing lertaro_index_store.dll." }
              $stream = $entry.Open()
              $image = [IO.MemoryStream]::new()
              try {
                $stream.CopyTo($image)
                $reader = [IO.BinaryReader]::new($image)
                $image.Position = 0x3c
                $peOffset = $reader.ReadInt32()
                $image.Position = $peOffset + 4
                $machine = $reader.ReadUInt16()
              } finally {
                $image.Dispose()
                $stream.Dispose()
              }
              if ($machine -ne $check.Machine) {
                throw "$($check.Name) ZIP contains PE Machine 0x$('{0:X4}' -f $machine); expected 0x$('{0:X4}' -f $check.Machine)."
              }
              Write-Host "$($check.Name) index store PE Machine verified."
            } finally { $archive.Dispose() }
          }
      - name: Sign candidate updates
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: ./Tools/SignRelease.ps1 -PackageDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: beta-candidate
          path: dist/*
          if-no-files-found: error

  install-smoke:
    needs: package
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            suffix: ''
            architecture: X64
          - runner: windows-11-arm
            suffix: '-arm64'
            architecture: Arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: beta-candidate
          path: candidate
      - name: Install, start and uninstall
        shell: pwsh
        run: ./Tools/TestInstallerSmoke.ps1 -InstallerPath "candidate/Lertaro-Setup${{ matrix.suffix }}.exe" -Architecture '${{ matrix.architecture }}'

