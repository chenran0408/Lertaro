name: Beta validation

on:
  push:
    branches:
      - fix/explorer-locate-hang

jobs:
  windows-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test app
        run: dotnet test Tests/App/App.csproj -c Release -v quiet
      - name: Test update core
        run: dotnet test Tests/Core/Core.csproj -c Release -v quiet
      - name: Test bundled actions
        run: dotnet test Tests/Plugins/CoreExtensions/CoreExtensions.csproj -c Release -v quiet
