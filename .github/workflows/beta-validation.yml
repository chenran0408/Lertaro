name: Beta validation

on:
  workflow_call:
    secrets:
      SIGNING_KEY:
        required: true
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/explorer-locate-hang
      - codex/v5.10.1-input-performance-glass

jobs:
  windows-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            rust_target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            rid: win-arm64
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public repository links
        shell: pwsh
        run: |
          $stale = rg -n 'github\.com/Lertaro/Lertaro' README.md Readmes
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Found stale links to the old Lertaro/Lertaro repository:`n$stale"
            exit 1
          }
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.rust_target }}
      - name: Test native index store
        run: cargo test --locked --target ${{ matrix.rust_target }} --manifest-path Core\NativeIndexStore\Cargo.toml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test app
        run: dotnet test Tests/App/App.csproj -c Release -r ${{ matrix.rid }} -p:RustIndexStoreTarget=${{ matrix.rust_target }} --logger "console;verbosity=normal" -v quiet
      - name: Test update core
        if: success() || failure()
        run: dotnet test Tests/Core/Core.csproj -c Release -r ${{ matrix.rid }} -p:RustIndexStoreTarget=${{ matrix.rust_target }} --logger "console;verbosity=normal" -v quiet
      - name: Test bundled actions
        if: success() || failure()
        run: dotnet test Tests/Plugins/CoreExtensions/CoreExtensions.csproj -c Release -r ${{ matrix.rid }} -p:RustIndexStoreTarget=${{ matrix.rust_target }} --logger "console;verbosity=normal" -v quiet

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-pc-windows-msvc
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install package compiler
        run: winget install JRSoftware.InnoSetup.7 --force --silent --no-upgrade --accept-source-agreements
      - name: Build both installers
        run: .\make.bat
      - name: Verify packaged index store architectures
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($check in @(
            @{ Path = 'dist/Lertaro-Portable.zip'; Machine = 0x8664; Name = 'x64' },
            @{ Path = 'dist/Lertaro-Portable-arm64.zip'; Machine = 0xAA64; Name = 'ARM64' }
          )) {
            $archive = [IO.Compression.ZipFile]::OpenRead($check.Path)
            try {
              $entry = $archive.Entries | Where-Object { $_.Name -eq 'lertaro_index_store.dll' } | Select-Object -First 1
              if (-not $entry) { throw "$($check.Name) ZIP is missing lertaro_index_store.dll." }
              $stream = $entry.Open()
              $image = [IO.MemoryStream]::new()
              try {
                $stream.CopyTo($image)
                $reader = [IO.BinaryReader]::new($image)
                $image.Position = 0x3c
                $peOffset = $reader.ReadInt32()
                $image.Position = $peOffset + 4
                $machine = $reader.ReadUInt16()
              } finally {
                $image.Dispose()
                $stream.Dispose()
              }
              if ($machine -ne $check.Machine) {
                throw "$($check.Name) ZIP contains PE Machine 0x$('{0:X4}' -f $machine); expected 0x$('{0:X4}' -f $check.Machine)."
              }
              Write-Host "$($check.Name) index store PE Machine verified."
            } finally { $archive.Dispose() }
          }
      - name: Sign candidate updates
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: ./Tools/SignRelease.ps1 -PackageDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: beta-candidate
          path: dist/*
          if-no-files-found: error

  install-smoke:
    needs: package
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            suffix: ''
            architecture: X64
          - runner: windows-11-arm
            suffix: '-arm64'
            architecture: Arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: beta-candidate
          path: candidate
      - name: Install, start and uninstall
        shell: pwsh
        run: ./Tools/TestInstallerSmoke.ps1 -InstallerPath "candidate/Lertaro-Setup${{ matrix.suffix }}.exe" -Architecture '${{ matrix.architecture }}'

  upgrade-smoke:
    needs: package
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: X64
          - runner: windows-11-arm
            architecture: Arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: beta-candidate
          path: candidate
      - name: Upgrade installed beta7 and uninstall
        shell: pwsh
        run: ./Tools/TestUpgradeSmoke.ps1 -PackageDirectory candidate -Architecture '${{ matrix.architecture }}'

  standard-user-update:
    needs: package
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: X64
            rid: win-x64
          - runner: windows-11-arm
            architecture: Arm64
            rid: win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: beta-candidate
          path: candidate
      - name: Build standard-user caller host
        run: dotnet publish Tools/UpdateSmokeClient/UpdateSmokeClient.csproj -c Release -r ${{ matrix.rid }} --self-contained false -p:EnableRustIndexStoreBuild=false -o probe
      - name: Exercise the application installer as a standard user
        shell: pwsh
        run: ./Tools/TestStandardUserUpdateSmoke.ps1 -PackageDirectory candidate -ClientDirectory probe -Architecture '${{ matrix.architecture }}'
